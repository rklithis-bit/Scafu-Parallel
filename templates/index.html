<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCAFU — Parallel</title>
<style>
:root{--cream:#fcf8ee;--gold:#a9814b;--ink:#202020;--panel:#f6f3ec}
*{box-sizing:border-box}
html{min-height:100%;background:#191919}
body{margin:0;min-height:100vh;padding:clamp(12px,3vw,32px);display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.shell{width:min(100%,1120px);min-height:min(820px,calc(100vh - 24px));background:var(--cream);border-radius:clamp(18px,3vw,36px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(24px,5vh,48px) 18px}
.brand{display:flex;align-items:center;gap:12px;font-size:clamp(30px,4vw,42px);margin-bottom:22px;color:#080808}
.logo{width:48px;height:53px;flex-shrink:0}
.card{width:min(100%,430px);background:var(--panel);border:1px solid #e8e0d2;border-radius:24px;padding:clamp(20px,4vw,32px);box-shadow:0 14px 36px #0000000d}
.kicker{font-size:clamp(15px,2vw,18px);letter-spacing:2px;margin:0 0 5px;color:#64533d}
.parallel{font-size:clamp(34px,5vw,46px);letter-spacing:clamp(3px,1vw,7px);line-height:1.1;margin:0}
.tag{font-size:15px;line-height:1.5;margin:10px 0 24px;color:#655d52}
.field{display:block;width:100%;height:52px;border:1px solid #e7dfd2;border-radius:13px;background:#fff;padding:0 15px;margin:0 0 14px;font:16px Arial,sans-serif;outline:none}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b18b5520}
.field::placeholder{color:#a99a83;letter-spacing:1px}
.submit{display:block;width:100%;min-height:50px;border:0;border-radius:13px;background:#171717;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:5px}
.submit:hover{background:#34302a}
.submit:disabled{opacity:.65;cursor:wait}
.links{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin-top:16px;color:var(--gold);font:14px Arial,sans-serif}
.links button{border:0;background:none;color:#8b6737;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.slogan{margin-top:20px;color:#7b6445;letter-spacing:clamp(2px,.5vw,4px);font-size:clamp(10px,1.5vw,13px);font-style:italic;text-align:center}
.error{font:14px/1.45 Arial,sans-serif;color:#a33;min-height:0;margin-top:10px;overflow-wrap:anywhere}
.error:empty{display:none}
.hidden{display:none!important}
@media(max-width:480px){body{padding:8px}.shell{min-height:calc(100vh - 16px);padding:24px 14px;border-radius:20px;justify-content:center}.brand{margin-bottom:18px}.logo{width:40px;height:44px}.card{border-radius:20px}.slogan{max-width:280px;line-height:1.6}}
@media(max-height:650px){.shell{min-height:calc(100vh - 24px);padding-top:18px;padding-bottom:18px}.brand{margin-bottom:12px}.tag{margin-bottom:16px}.field{height:46px;margin-bottom:10px}.slogan{margin-top:12px}}
</style>
</head>
<body>
<main class="shell">
<div class="brand"><svg class="logo" viewBox="0 0 64 70" aria-label="SCAFU logo"><polygon points="32,2 61,19 61,51 32,68 3,51 3,19" fill="#050505"/><circle cx="32" cy="35" r="27" fill="#ff1018"/><polygon points="32,8 57,49 7,49" fill="#fff"/></svg><span>SCAFU</span></div>
<form class="card" id="authForm">
<p class="kicker">Lead the Innovation.</p><h1 class="parallel">Parallel</h1><p class="tag">The parallel way of communication.</p>
<div id="usernameWrap" class="hidden"><input class="field" id="username" placeholder="Username" autocomplete="nickname"></div>
<input class="field" id="email" type="email" placeholder="Scafu ID" autocomplete="username" aria-label="Scafu ID" required>
<input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
<button class="submit" id="submitButton" type="submit">Sign In</button>
<div class="links"><button type="button" id="forgot">Forgot password?</button><span aria-hidden="true">•</span><button type="button" id="toggle">Create account</button></div>
<div class="error" id="error" role="status" aria-live="polite"></div>
</form>
<div class="slogan">We do things that matter //</div>
</main>
<script>
const form=document.getElementById("authForm");
const toggle=document.getElementById("toggle");
const usernameWrap=document.getElementById("usernameWrap");
const username=document.getElementById("username");
const email=document.getElementById("email");
const password=document.getElementById("password");
const submitButton=document.getElementById("submitButton");
const error=document.getElementById("error");
let mode="signin";
toggle.onclick=()=>{mode=mode==="signin"?"signup":"signin";usernameWrap.classList.toggle("hidden",mode!=="signup");username.required=mode==="signup";password.autocomplete=mode==="signup"?"new-password":"current-password";submitButton.textContent=mode==="signin"?"Sign In":"Create Account";toggle.textContent=mode==="signin"?"Create account":"Sign in instead";error.textContent="";};
form.onsubmit=async e=>{e.preventDefault();error.textContent="";submitButton.disabled=true;submitButton.textContent=mode==="signin"?"Signing in…":"Creating account…";try{const r=await fetch("/api/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:password.value,username:username.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||"Authentication failed.");location.href=d.redirect||"/chat";}catch(err){error.textContent=err.message||"Something went wrong. Please try again.";}finally{submitButton.disabled=false;submitButton.textContent=mode==="signin"?"Sign In":"Create Account";}};
document.getElementById("forgot").onclick=()=>{error.textContent="Password reset is not configured on this page yet. Use Firebase Authentication password reset or add a reset flow.";};
</script>
</body>
</html>
