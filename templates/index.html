
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAFU — Parallel</title>

<style>
:root {
  --cream: #fcf8ee;
  --glass: rgba(246, 246, 247, 0.84);
  --gold: #ad8752;
  --ink: #292929;
  --olive: #c3c5a4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--cream);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  width: 100%;
  max-width: 410px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 19px;
  color: #050505;
  font-size: 43px;
}

.brand svg {
  width: 55px;
  height: 62px;
  flex: none;
}

.card {
  width: 100%;
  padding: 15px 27px 17px;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 26px;
  background: var(--glass);
  box-shadow:
    0 8px 30px rgba(0,0,0,.15),
    inset 0 1px 1px rgba(255,255,255,.95);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.kicker {
  margin: 0;
  font-size: 20px;
  letter-spacing: 4px;
}

.parallel {
  margin: 1px 0 0;
  font-size: 43px;
  letter-spacing: 9px;
  font-weight: 600;
}

.tagline {
  margin: 1px 0 53px;
  font-size: 16px;
}

.field {
  display: block;
  width: 100%;
  height: 58px;
  margin-bottom: 33px;
  padding: 0 21px;
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 19px;
  outline: none;
  background: rgba(255,255,255,.94);
  box-shadow:
    0 5px 17px rgba(0,0,0,.19),
    inset 0 1px 2px #fff;
  color: var(--ink);
  font-family: Georgia, serif;
  font-size: 16px;
  letter-spacing: 3px;
}

.field::placeholder {
  color: #c3a47f;
  font-style: italic;
  opacity: 1;
}

.field:focus {
  border-color: #c8b18d;
  box-shadow: 0 0 0 3px rgba(173,135,82,.12);
}

/* Glass toggle */
.toggle-wrap {
  display: flex;
  justify-content: center;
  margin-top: -3px;
}

.toggle {
  position: relative;
  width: 106px;
  height: 54px;
  padding: 0;
  border: 1px solid rgba(160,160,150,.62);
  border-radius: 28px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.82),
    rgba(238,238,234,.52)
  );
  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.95),
    inset 0 -1px 3px rgba(0,0,0,.04);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .3s ease, box-shadow .3s ease;
}

.knob {
  position: absolute;
  left: -1px;
  top: -1px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  transition: transform .32s cubic-bezier(.2,.8,.2,1);
}

.knob svg {
  display: block;
  width: 54px;
  height: 54px;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.08));
}

.toggle[aria-checked="true"] {
  background: linear-gradient(
    145deg,
    rgba(214,216,193,.82),
    rgba(245,245,239,.85)
  );
  box-shadow:
    inset 0 1px 4px rgba(0,0,0,.08),
    0 0 12px rgba(195,197,164,.25);
}

.toggle[aria-checked="true"] .knob {
  transform: translateX(52px);
}

.toggle:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 5px;
}

.toggle:disabled {
  cursor: wait;
  opacity: .75;
}

.status {
  min-height: 18px;
  margin-top: 12px;
  text-align: center;
  font: 13px Arial, sans-serif;
  color: #a33;
}

.links {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 1px;
  color: var(--gold);
  font-size: 16px;
}

.links button {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.links button:hover {
  text-decoration: underline;
}

.slogan {
  margin-top: 15px;
  color: #806a4b;
  font-size: 16px;
  font-style: italic;
  letter-spacing: 5px;
  text-align: center;
  white-space: nowrap;
}

@media (max-width: 420px) {
  body { padding: 18px; }
  .brand { font-size: 36px; }
  .brand svg { width: 48px; height: 54px; }
  .card { padding: 20px 20px 17px; }
  .kicker { font-size: 17px; letter-spacing: 3px; }
  .parallel { font-size: 37px; letter-spacing: 7px; }
  .tagline { font-size: 14px; margin-bottom: 42px; }
  .field { margin-bottom: 26px; }
  .slogan { font-size: 12px; letter-spacing: 3px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>
<main class="page">

  <div class="brand" aria-label="SCAFU">
    <svg viewBox="0 0 64 70" role="img" aria-label="Parallel logo">
      <polygon points="32,2 61,19 61,51 32,68 3,51 3,19"
               fill="#050505"/>
      <circle cx="32" cy="35" r="27" fill="#ff1018"/>
      <polygon points="32,8 57,49 7,49" fill="#fff"/>
    </svg>
    <span>SCAFU</span>
  </div>

  <form class="card" id="loginForm">
    <p class="kicker">Lead the Innovation.</p>
    <h1 class="parallel">Parallel</h1>
    <p class="tagline">The parallel way of communication.</p>

    <input
      class="field"
      id="loginId"
      name="email"
      type="email"
      autocomplete="username"
      placeholder="Scafu ID"
      aria-label="Scafu ID or email"
      required
    >

    <input
      class="field"
      id="loginPassword"
      name="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
      aria-label="Password"
      required
    >

    <div class="toggle-wrap">
      <button
        class="toggle"
        id="loginToggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Switch on to sign in"
      >
        <span class="knob">
          <svg viewBox="0 0 54 54" aria-hidden="true">
            <circle cx="27" cy="27" r="26.5"
                    fill="#f7f7f2" stroke="#c9c9c2"/>
            <g stroke="#c3c5a4" stroke-width="4"
               stroke-linecap="round">
              <path d="M16 36 L27 14"/>
              <path d="M25 36 L36 14"/>
            </g>
          </svg>
        </span>
      </button>
    </div>

    <div class="status" id="loginStatus" role="status"
         aria-live="polite"></div>

    <div class="links">
      <button type="button" id="forgotButton">forgot password</button>
      <span>•</span>
      <button type="button" id="signupButton">Signup</button>
    </div>
  </form>

  <div class="slogan">We do things that matter //</div>
</main>

<script>
const form = document.getElementById("loginForm");
const toggle = document.getElementById("loginToggle");
const status = document.getElementById("loginStatus");
let busy = false;

function setToggle(on) {
  toggle.setAttribute("aria-checked", String(on));
  toggle.setAttribute(
    "aria-label",
    on ? "Switch off" : "Switch on to sign in"
  );
}

async function signIn() {
  if (busy) return;

  if (!form.reportValidity()) {
    setToggle(false);
    return;
  }

  busy = true;
  toggle.disabled = true;
  status.style.color = "#806a4b";
  status.textContent = "Signing in…";

  try {
    const response = await fetch("/api/auth/signin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email: document.getElementById("loginId").value.trim(),
        password: document.getElementById("loginPassword").value
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message ||
                      "Sign-in failed. Check your credentials.");
    }

    if (data.redirect) {
      window.location.assign(data.redirect);
    } else {
      window.location.assign("/chat");
    }
  } catch (error) {
    status.style.color = "#a33";
    status.textContent = error.message || "Unable to sign in.";
    setToggle(false);
  } finally {
    busy = false;
    toggle.disabled = false;
  }
}

toggle.addEventListener("click", () => {
  const isOn = toggle.getAttribute("aria-checked") === "true";

  if (isOn) {
    setToggle(false);
    status.textContent = "";
  } else {
    setToggle(true);
    signIn();
  }
});

form.addEventListener("submit", event => {
  event.preventDefault();
  setToggle(true);
  signIn();
});

document.getElementById("signupButton").addEventListener("click", () => {
  window.location.assign("/?mode=signup");
});

document.getElementById("forgotButton").addEventListener("click", () => {
  status.style.color = "#806a4b";
  status.textContent =
    "Connect this action to your Firebase password-reset flow.";
});
</script>
</body>
</html>
