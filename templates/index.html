<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCAFU — Parallel</title>
<style>
:root{--cream:#fcf8ee;--panel:#f5f5f5;--gold:#b18b55;--shadow:8px 8px 22px #0002,-7px -7px 20px #fff9}
*{box-sizing:border-box}body{margin:0;background:#191919;font-family:Georgia,"Times New Roman",serif;color:#292929}.wrap{min-height:100vh;padding:28px;display:grid;place-items:center}.shell{width:min(100%,1440px);min-height:88vh;border-radius:38px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}.brand{display:flex;align-items:center;gap:15px;font-size:clamp(32px,4vw,46px);color:#000;margin-bottom:26px}.logo{width:58px;height:64px}.card{width:min(100%,485px);background:#f5f5f5;border-radius:30px;padding:24px 32px 32px;box-shadow:var(--shadow)}.kicker{font-size:21px;letter-spacing:4px;margin:0}.parallel{font-size:48px;letter-spacing:10px;margin:0}.tag{margin:0 0 44px;font-size:18px}.field{width:100%;height:62px;border:0;border-radius:20px;background:white;box-shadow:var(--shadow);padding:0 23px;margin-bottom:25px;outline:none}.field::placeholder{color:#c6a982;letter-spacing:5px;font-style:italic}.links{text-align:center;color:var(--gold);margin-top:12px}.links button{border:0;background:none;color:var(--gold);font-size:17px;cursor:pointer}.slogan{margin-top:18px;color:#7b6445;letter-spacing:6px;font-style:italic;text-align:center}.error{font:14px Arial;color:#a33;min-height:18px;margin-top:12px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:10px}.shell{min-height:95vh;border-radius:24px}.card{padding:22px}.parallel{font-size:38px}.slogan{font-size:12px;letter-spacing:3px}}
</style></head><body><main class="wrap"><section class="shell">
<div class="brand"><svg class="logo" viewBox="0 0 64 70" aria-label="SCAFU logo"><polygon points="32,2 61,19 61,51 32,68 3,51 3,19" fill="#050505"/><circle cx="32" cy="35" r="27" fill="#ff1018"/><polygon points="32,8 57,49 7,49" fill="#fff"/></svg><span>SCAFU</span></div>
<form class="card" id="authForm"><p class="kicker">Lead the Innovation.</p><h1 class="parallel">Parallel</h1><p class="tag">The parallel way of communication.</p>
<div id="usernameWrap" class="hidden"><input class="field" id="username" placeholder="Username" autocomplete="nickname"></div>
<input class="field" id="email" type="email" placeholder="Scafu ID" autocomplete="username" required>
<input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
<div class="links"><button type="button" id="forgot">forgot password</button> &nbsp; • &nbsp; <button type="button" id="toggle">Signup</button></div><div class="error" id="error" role="status"></div></form>
<div class="slogan">We do things that matter //</div></section></main>
<script>
const form=document.getElementById("authForm"),toggle=document.getElementById("toggle"),usernameWrap=document.getElementById("usernameWrap"),username=document.getElementById("username"),password=document.getElementById("password"),error=document.getElementById("error");let mode="signin";
toggle.onclick=()=>{mode=mode==="signin"?"signup":"signin";usernameWrap.classList.toggle("hidden",mode!=="signup");username.required=mode==="signup";password.autocomplete=mode==="signup"?"new-password":"current-password";toggle.textContent=mode==="signin"?"Signup":"Signin";error.textContent="";};
form.onsubmit=async e=>{e.preventDefault();error.textContent="";try{const r=await fetch("/api/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:password.value,username:username.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||"Authentication failed.");location.href=d.redirect||"/chat";}catch(err){error.textContent=err.message;}};
document.getElementById("forgot").onclick=()=>{error.textContent="Password reset is not configured on this page yet. Use Firebase Authentication password reset or add a reset flow.";};
</script></body></html>
