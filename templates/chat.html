<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <title>SCAFU — messages</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="chat-body">
  <main class="chat-shell" id="scafu-app" data-private-allowed="{{ 'true' if private_allowed else 'false' }}" data-username="{{ username }}">
    <header class="topbar">
      <a class="brand" href="/chat"><span class="brand-mark">s</span><span>SCAFU</span></a>
      <div class="top-actions"><span class="signed-in">{{ username }}</span>
        <form action="{{ url_for('logout') }}" method="post"><button class="quiet" type="submit">Sign out</button></form>
      </div>
    </header>
    <nav class="room-tabs" aria-label="Chat rooms">
      <button type="button" class="room-tab active" data-room="community">Community</button>
      {% if private_allowed %}<button type="button" class="room-tab" data-room="private">Private chat</button>{% endif %}
    </nav>
    <section class="conversation">
      <header class="conversation-head"><div class="avatar" id="room-avatar">C</div><div><h1 id="room-title">Community</h1><p id="room-subtitle" class="muted small">Everyone signed in can join</p></div><span class="lock-label" id="room-label">GROUP</span></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="empty-note" class="empty-note hidden"></div>
      <p id="chat-error" class="notice chat-error hidden" role="status"></p>
      <form id="message-form" class="composer" enctype="multipart/form-data">
        <label class="attach" title="Attach image">＋<input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
        <div class="composer-main"><div id="image-preview" class="image-preview hidden"></div><textarea id="message" name="message" rows="1" maxlength="4000" placeholder="Message the community…" aria-label="Message"></textarea></div>
        <button class="send-button" type="submit" aria-label="Send message">↑</button>
      </form>
      <p class="composer-hint">Enter to send · Shift + Enter for a new line · Images up to 10 MB</p>
    </section>
    <footer class="app-footer">SCAFU <span>·</span> a little closer, together</footer>
  </main>
  <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
</body></html>
